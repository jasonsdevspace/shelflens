query Search($input: SearchInput!, $explain: Boolean = false) {
    search(input: $input) {
        total
        page
        pageSize
        totalPages
        matching
        sort {
            by
            direction
        }
        merchandising {
            applied
            setAsideBySort
        }
        items {
            score @include(if: $explain)
            explanation @include(if: $explain) {
                matches {
                    typed
                    matched
                    field
                    route
                }
                rules {
                    ruleId
                    action
                    weight
                }
            }
            product {
                sku
                name
                colors
                brand {
                    name
                }
                price {
                    min {
                        amount
                        currency
                    }
                    max {
                        amount
                        currency
                    }
                }
                rating {
                    average
                    count
                }
                inStock
            }
        }
        facets {
            name
            attribute
            ... on ValueFacet {
                buckets {
                    value
                    count
                }
            }
            ... on RangeFacet {
                ranges: buckets {
                    from
                    to
                    count
                }
            }
            ... on StatsFacet {
                count
                min
                max
            }
        }
    }
}
