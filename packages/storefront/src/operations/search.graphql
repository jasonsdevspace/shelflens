query Search($input: SearchInput!) {
    search(input: $input) {
        total
        page
        pageSize
        totalPages
        matching
        sort {
            by
            direction
        }
        items {
            product {
                sku
                name
                colors
                brand {
                    name
                }
                price {
                    min {
                        amount
                        currency
                    }
                    max {
                        amount
                        currency
                    }
                }
                rating {
                    average
                    count
                }
                inStock
            }
        }
        facets {
            name
            attribute
            ... on ValueFacet {
                buckets {
                    value
                    count
                }
            }
            ... on RangeFacet {
                ranges: buckets {
                    from
                    to
                    count
                }
            }
            ... on StatsFacet {
                count
                min
                max
            }
        }
    }
}
