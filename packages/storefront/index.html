<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"
        />
        <meta name="color-scheme" content="light dark" />
        <script>
            // The theme the portfolio saved, or the system's, set before the first
            // paint so the page never flashes the other one. Same origin, same
            // key, so jasonsdevspace.com and this page switch together.
            (function () {
                try {
                    var s = localStorage.getItem('theme'),
                        d = window.matchMedia('(prefers-color-scheme: dark)').matches,
                        t = s === 'dark' || s === 'light' ? s : d ? 'dark' : 'light';
                    document.documentElement.setAttribute('data-theme', t);
                } catch (e) {
                    document.documentElement.setAttribute('data-theme', 'light');
                }
            })();
        </script>
        <meta
            name="description"
            content="ShelfLens, a product search demo: search as you type, facets, merchandising rules and an explanation for every result."
        />
        <title>ShelfLens</title>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
