name: CI

on:
    push:
        branches: [main]
    # Every pull request, not only those into main, so a PR stacked on
    # another's branch is checked before it is merged down.
    pull_request:
    # A deploy by hand, which still runs every check first.
    workflow_dispatch:
    # The release workflow runs these same checks before it publishes.
    workflow_call:

permissions:
    contents: read

# A newer push to a pull request supersedes the run in progress. A push to
# main does not: a run that has handed an artifact to Pages and is then
# canceled leaves the deployment pending, so runs on main wait their turn.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    verify:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Type-check
              run: npm run type-check

            - name: Lint
              run: npm run lint

            - name: Format check
              run: npm run format:check

            - name: Prose check
              run: npm run prose

            - name: Node version check
              run: npm run node-check

            - name: Test
              run: npm run test:run

            # The server's types are generated from the schema and committed.
            # A schema change without regenerating them fails here.
            - name: Check the generated types match the schema
              run: npm run codegen && git diff --exit-code -- packages/api/src/generated packages/storefront/src/generated

            # The packages are published from their compiled output, so a
            # build that compiles but emits something broken is caught here.
            - name: Build
              run: npm run build

            # The storefront is what the demo deploys. Its build bundles the
            # API into a service worker, so a Node import that slipped past
            # lint would fail here.
            - name: Build the storefront
              run: npm run storefront

    # The storefront in a real browser, served as the demo is served, with
    # the service worker answering and axe auditing each page. Desktop and
    # phone, since the facets and the popover lay out differently on each.
    browser:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Install Chromium
              run: npx playwright install --with-deps chromium

            - name: Browser tests
              run: npm run e2e

            # Lighthouse's accessibility audit, which must score a hundred on
            # each page it checks. Runs against the build the browser tests made.
            - name: Accessibility audit
              run: npm run lighthouse

            - name: Keep the report when something fails
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: playwright-report
                  path: |
                      packages/storefront/playwright-report
                      packages/storefront/test-results
                  retention-days: 7

    # The engine is published with an engines range, and this proves it works
    # on the lowest Node that range admits, as someone installing it from npm
    # gets it: packed, installed into an empty project outside the repository,
    # and used through its public exports and its types.
    floor:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            # Packing runs the engine's build, on the Node the project builds on,
            # which is how the published package is made.
            - name: Pack the engine
              run: npm pack --workspace @jasonsdevspace/shelflens --pack-destination "$RUNNER_TEMP"

            # Written as an exact version, because setup-node given a range
            # installs the newest Node in it, the opposite of a floor. The file
            # is not committed, and its name is not one the Node check reads.
            - name: Work out the floor
              run: |
                  node -e "import('./packages/engine/smoke/floor.mjs').then(({ floorOf }) => {
                      const floor = floorOf(require('./packages/engine/package.json').engines.node);
                      if (floor === undefined) throw new Error('engines.node is not a range the floor job can read');
                      console.log(floor);
                  })" > engine-floor
                  echo "FLOOR=$(cat engine-floor)" >> "$GITHUB_ENV"

            - name: Setup the floor Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: engine-floor

            # Outside the repository, so the import cannot resolve through the
            # workspace's own link to the engine.
            - name: Install the packed engine into an empty project
              run: |
                  mkdir "$RUNNER_TEMP/consumer"
                  cd "$RUNNER_TEMP/consumer"
                  npm init -y
                  npm pkg set type=module
                  npm install --engine-strict "$RUNNER_TEMP"/jasonsdevspace-shelflens-*.tgz
                  smoke="$GITHUB_WORKSPACE/packages/engine/smoke"
                  cp "$smoke"/consumer.mjs "$smoke"/exports.mjs "$smoke"/types.ts "$smoke"/tsconfig.nodenext.json "$smoke"/tsconfig.bundler.json .

            - name: Use the engine on the floor
              working-directory: ${{ runner.temp }}/consumer
              run: node consumer.mjs

            - name: Compile against its types, as Node and as a bundler resolve them
              working-directory: ${{ runner.temp }}/consumer
              run: |
                  node "$GITHUB_WORKSPACE/node_modules/typescript/bin/tsc" -p tsconfig.nodenext.json
                  node "$GITHUB_WORKSPACE/node_modules/typescript/bin/tsc" -p tsconfig.bundler.json

    # The demo, published to GitHub Pages at jasonsdevspace.com/shelflens/
    # once everything above has passed on main. A merge that fails a check
    # is never deployed.
    deploy:
        needs: [verify, browser, floor]
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        # A job's own permissions replace the workflow's, so the read the
        # checkout needs has to be named here beside the two Pages needs.
        permissions:
            contents: read
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            # The page, the catalog, the rules and the worker, built for the
            # path the project site is served under.
            - name: Build the storefront for the project site
              run: npm run storefront
              env:
                  BASE_PATH: /shelflens/

            - name: Configure Pages
              uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

            - name: Upload the site
              uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: packages/storefront/dist

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
