name: CI

on:
    push:
        branches: [main]
    # Every pull request, not only those into main, so a PR stacked on
    # another's branch is checked before it is merged down.
    pull_request:
    # A deploy by hand, which still runs every check first.
    workflow_dispatch:
    # The release workflow runs these same checks before it publishes, and
    # publishes only the packed engine whose checksum the check reports.
    workflow_call:
        outputs:
            engine-sha256:
                description: The checksum of the packed engine the oldest Node check proved.
                value: ${{ jobs.floor.outputs.sha256 }}

permissions:
    contents: read

# A newer push to a pull request supersedes the run in progress. A push to
# main does not: runs on main wait their turn, so the newest commit is always
# the last deployed, and a run that has handed an artifact to Pages is never
# canceled, which would leave the deployment pending.
concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    verify:
        name: Lint, test and build
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Type-check
              run: npm run type-check --workspaces && npx tsc -p scripts

            - name: Lint
              run: npx eslint .

            - name: Format check
              run: npx prettier --check .

            - name: Prose check
              run: node scripts/check-prose.mjs

            - name: Node version check
              run: node scripts/check-node.mjs

            - name: Check for unused exports and dependencies
              run: npx knip --tsConfig tsconfig.build.json

            - name: Unit tests
              run: npx vitest run

            # The server's types are generated from the schema and committed.
            # A schema change without regenerating them fails here.
            - name: Check the generated types match the schema
              run: npm run codegen && git diff --exit-code -- packages/api/src/generated apps/storefront/src/generated

            # The packages are published from their compiled output, so a
            # build that compiles but emits something broken is caught here.
            - name: Build
              run: npm run build

            # The storefront is what the demo deploys. Its build bundles the
            # API into a service worker, so a Node import that slipped past
            # lint would fail here.
            - name: Build the storefront
              run: npm run storefront

            # The budgets held over the files the build ships, compressed as a
            # server sends them, beside the test that measures the source.
            - name: Size budgets on the build
              run: npm run budget

    # The storefront in a real browser, served as the demo is served, with
    # the service worker answering and axe auditing each page. Desktop and
    # phone, since the facets and the popover lay out differently on each.
    browser:
        name: Browser tests
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            # The runner image has the libraries Chromium needs, so only the browser is
            # fetched. Installing the libraries again reads Ubuntu's mirror, which has been
            # slow enough to run a job out of time before its tests began. Chromium is started
            # once here, so a library a later runner image lacks fails this step, not a test.
            - name: Install Chromium
              timeout-minutes: 3
              run: |
                  npx playwright install chromium
                  node -e "require('@playwright/test').chromium.launch().then((browser) => browser.close())"

            - name: Browser tests
              run: npm run e2e

            - name: Upload the report on failure
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: playwright-report
                  path: |
                      apps/storefront/playwright-report
                      apps/storefront/test-results
                  retention-days: 7

    # Lighthouse as a phone on a slow network loads each page: a hundred for
    # accessibility, ninety for performance, and a largest paint and a layout
    # shift a visit counts as good. Its own job, so it runs beside the browser
    # tests rather than after them.
    lighthouse:
        name: Lighthouse audits
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            # The runner image has the libraries Chromium needs, so only the browser is
            # fetched. Installing the libraries again reads Ubuntu's mirror, which has been
            # slow enough to run a job out of time before its tests began. Chromium is started
            # once here, so a library a later runner image lacks fails this step, not a test.
            - name: Install Chromium
              timeout-minutes: 3
              run: |
                  npx playwright install chromium
                  node -e "require('@playwright/test').chromium.launch().then((browser) => browser.close())"

            # The script builds the store before it audits it.
            - name: Lighthouse audits
              run: npm run lighthouse

    # The screenshots, taken in Playwright's own Linux image, the one place they
    # are taken, since text is drawn differently on every other system. The
    # image's version is the one @playwright/test is pinned to, and the two
    # move together. When a picture is missing or differs, the run fails and
    # keeps what it took, to accept with `npm run screenshots:accept <run id>`.
    visual:
        name: Screenshot comparison
        runs-on: ubuntu-latest
        timeout-minutes: 10
        container:
            # Pinned by digest, as the actions are, so the image cannot change under its tag.
            image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
        env:
            VISUAL: '1'
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Build the storefront
              run: npm run storefront

            - name: Compare the screenshots
              run: npx playwright test --config apps/storefront/playwright.config.ts --project visual-desktop --project visual-phone

            - name: Collect the screenshots
              if: failure()
              run: node scripts/screenshots.mjs collect

            - name: Upload the screenshots
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: screenshots
                  path: apps/storefront/e2e/__screenshots__
                  if-no-files-found: ignore
                  retention-days: 7

            # A test that failed for another reason, a page that never settled say, is
            # read from its trace and the report.
            - name: Upload the report on failure
              if: failure()
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: visual-report
                  path: |
                      apps/storefront/playwright-report
                      apps/storefront/test-results
                  if-no-files-found: ignore
                  retention-days: 7

    # The engine is published with an engines range, and this proves it works
    # on the lowest Node that range admits, as someone installing it from npm
    # gets it: packed, installed into an empty project outside the repository,
    # and used through its public exports and its types.
    floor:
        name: Package on oldest Node
        runs-on: ubuntu-latest
        timeout-minutes: 10
        outputs:
            sha256: ${{ steps.pack.outputs.sha256 }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            # Packing runs the engine's build, on the Node the project builds on,
            # which is how the published package is made.
            # Its checksum is a job output, which no other job in the run can change,
            # unlike the artifact, so the release publishes only this tarball.
            - name: Pack the engine
              id: pack
              run: |
                  npm pack --workspace @jasonsdevspace/shelflens --pack-destination "$RUNNER_TEMP"
                  tarballs=("$RUNNER_TEMP"/jasonsdevspace-shelflens-*.tgz)
                  if [ "${#tarballs[@]}" -ne 1 ] || [ ! -f "${tarballs[0]}" ]; then
                      echo "packing made ${#tarballs[@]} tarballs, not one"
                      exit 1
                  fi
                  sum=$(sha256sum "${tarballs[0]}" | cut -d' ' -f1)
                  echo "sha256=$sum" >> "$GITHUB_OUTPUT"

            # The standard check of a published package's manifest: that its
            # exports, types and files point at what the tarball holds. Packing
            # has just built the engine, and this names a mistake before the
            # slower steps reach it.
            - name: Check the package manifest
              run: npx publint packages/engine

            # Written as an exact version, because setup-node given a range
            # installs the newest Node in it, the opposite of the oldest. The file
            # is not committed, and its name is not one the Node check reads.
            - name: Find the oldest supported Node
              run: |
                  node -e "import('./packages/engine/smoke/floor.mjs').then(({ floorOf }) => {
                      const floor = floorOf(require('./packages/engine/package.json').engines.node);
                      if (floor === undefined) throw new Error('engines.node is not a range the oldest Node check can read');
                      console.log(floor);
                  })" > engine-floor
                  echo "FLOOR=$(cat engine-floor)" >> "$GITHUB_ENV"

            - name: Set up the oldest supported Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: engine-floor

            # Outside the repository, so the import cannot resolve through the
            # workspace's own link to the engine.
            - name: Install the packed engine into an empty project
              run: |
                  mkdir "$RUNNER_TEMP/consumer"
                  cd "$RUNNER_TEMP/consumer"
                  npm init -y
                  npm pkg set type=module
                  npm install --engine-strict "$RUNNER_TEMP"/jasonsdevspace-shelflens-*.tgz
                  smoke="$GITHUB_WORKSPACE/packages/engine/smoke"
                  cp "$smoke"/consumer.mjs "$smoke"/exports.mjs "$smoke"/types.ts "$smoke"/tsconfig.nodenext.json "$smoke"/tsconfig.bundler.json .

            - name: Run the engine on that Node
              working-directory: ${{ runner.temp }}/consumer
              run: node consumer.mjs

            # As Node and as a bundler resolve them.
            - name: Type-check as an installer would
              working-directory: ${{ runner.temp }}/consumer
              run: |
                  node "$GITHUB_WORKSPACE/node_modules/typescript/bin/tsc" -p tsconfig.nodenext.json
                  node "$GITHUB_WORKSPACE/node_modules/typescript/bin/tsc" -p tsconfig.bundler.json

            # The release publishes this tarball, now that it is proven, so the
            # job that holds the publish token never installs or builds anything.
            # Kept on every run, so the hand-off is exercised before a release
            # needs it, and long enough to repeat a release's publish.
            - name: Upload the packed engine
              uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: engine-package
                  path: ${{ runner.temp }}/jasonsdevspace-shelflens-*.tgz
                  if-no-files-found: error
                  retention-days: 7
                  overwrite: true

    # The demo, published to GitHub Pages at jasonsdevspace.com/shelflens/
    # once everything above has passed on main. A merge that fails a check
    # is never deployed. The site is built in a job with no more than read
    # access, so nothing the build installs or runs can deploy, and the
    # deploy job runs only GitHub's own Pages actions.
    site:
        name: Build the demo site
        needs: [verify, browser, lighthouse, floor, visual]
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Set up Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version-file: .nvmrc
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            # The page, the catalog, the rules and the worker, built for the
            # path the project site is served under.
            - name: Build the storefront for the project site
              run: npm run storefront
              env:
                  BASE_PATH: /shelflens/

            - name: Upload the site
              uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: apps/storefront/dist

    deploy:
        name: Deploy the demo
        needs: site
        runs-on: ubuntu-latest
        timeout-minutes: 10
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Configure Pages
              uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
