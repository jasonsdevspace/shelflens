name: Pull request message

# A pull request's title, with its number, becomes the commit on main when it is squashed, and its
# body is what a reader of the pull request sees. Both are written on GitHub where no hook runs, so
# they pass the same check a commit message does, in the shared workflow every repository calls,
# pinned to a commit. It runs the prose check from the tarball this repository's lockfile names,
# once the tarball matches the lockfile's hash, and installs nothing. The check is a workflow of its
# own, so an edit to the title or body runs it again without running CI. GitHub shows it under this
# job's name and then the shared job's, as "PR message / PR title and body".
on:
    pull_request:
        types: [opened, edited, reopened, synchronize]

permissions:
    contents: read

concurrency:
    group: message-${{ github.event.pull_request.number }}
    cancel-in-progress: true

jobs:
    message:
        name: PR message
        uses: jasonsdevspace/tooling/.github/workflows/pr-message.yml@80618fd110dd29e0f08723eb9065a12ed67fec96 # pr-message-v1.0.0
