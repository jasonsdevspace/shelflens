name: Demo

# Publishes the storefront to GitHub Pages, at jasonsdevspace.com/shelflens/.
# Runs when anything the demo is built from changes on main, and by hand.
on:
    push:
        branches: [main]
        paths:
            - 'packages/**'
            - 'package.json'
            - 'package-lock.json'
            - '.github/workflows/demo.yml'
    workflow_dispatch:

permissions:
    contents: read

# One deployment at a time, and a newer one waits for the one in progress.
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '24'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            # The page, the catalog, the rules and the worker, built for the
            # path the project site is served under.
            - name: Build the storefront for the project site
              run: npm run storefront
              env:
                  BASE_PATH: /shelflens/

            - name: Configure Pages
              uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

            - name: Upload the site
              uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: packages/storefront/dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
