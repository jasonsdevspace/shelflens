name: Release

# Releases a package when its tag is pushed. An engine tag such as
# engine-v0.2.0 publishes the engine to npm. A storefront tag such as
# storefront-v1.2.0 marks a version of the demo, which is deployed from main
# already, so it gets a release on GitHub and nothing else. Either way the
# tag has to name a commit on main, match the version in that package's
# package.json, and have an entry in its changelog, or nothing is released.
# Every check CI runs, runs first. The publish uses npm's
# trusted publishing: the workflow proves who it is with an OpenID Connect
# token, so no npm token is stored anywhere, and each version carries
# provenance that links it to the commit and the run that built it.
#
# The version is staged, not released. npm holds it until Jason promotes
# it on the package page, so a tag, a green run and a click are all needed
# before anyone can install it, and nothing that happens in CI alone can
# change what "latest" points at. A prerelease version, one with a hyphen,
# is staged under the "next" tag and marked as a prerelease on GitHub.
on:
    push:
        tags:
            - 'engine-v*'
            - 'storefront-v*'

permissions:
    contents: read

jobs:
    # The cheap checks first, so a mistyped tag fails in seconds.
    agree:
        runs-on: ubuntu-latest
        outputs:
            version: ${{ steps.version.outputs.version }}
            prerelease: ${{ steps.version.outputs.prerelease }}
            package: ${{ steps.version.outputs.package }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '24'

            # The tag names the version, the package declares it, and the
            # changelog explains it. All three have to agree, and the commit
            # has to be on main, so nothing unreviewed is ever released.
            - name: Check the tag, the version, the changelog and the branch agree
              id: version
              env:
                  TAG: ${{ github.ref_name }}
              run: |
                  package="${TAG%%-v*}"
                  version="${TAG#"$package"-v}"
                  dir="packages/$package"
                  declared=$(node -p "require('./$dir/package.json').version")
                  if [ "$version" != "$declared" ]; then
                      echo "the tag says $version but $dir/package.json says $declared"
                      exit 1
                  fi
                  if ! grep -qxF -- "## $version" "$dir/CHANGELOG.md"; then
                      echo "$dir/CHANGELOG.md has no entry for $version"
                      exit 1
                  fi
                  echo "package=$package" >> "$GITHUB_OUTPUT"
                  if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
                      echo "the tagged commit is not on main"
                      exit 1
                  fi
                  echo "version=$version" >> "$GITHUB_OUTPUT"
                  case "$version" in
                      *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
                      *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
                  esac

    # A called workflow may ask for no more than its caller grants, and CI's
    # deploy job asks for the Pages permissions even though it never runs
    # on a tag, so they are granted here or the run fails at startup.
    checks:
        needs: agree
        uses: ./.github/workflows/ci.yml
        permissions:
            contents: read
            pages: write
            id-token: write

    publish:
        needs: [agree, checks]
        if: needs.agree.outputs.package == 'engine'
        runs-on: ubuntu-latest
        # The environment is what npm's trusted publisher is registered
        # against, and where a required reviewer can be set.
        environment: npm
        permissions:
            contents: write
            id-token: write
        env:
            VERSION: ${{ needs.agree.outputs.version }}
            PRERELEASE: ${{ needs.agree.outputs.prerelease }}
            TAG: ${{ github.ref_name }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Setup Node
              uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
              with:
                  node-version: '24'
                  cache: 'npm'

            # Trusted publishing needs a recent npm, whatever the runner ships.
            - name: Use a current npm
              run: npm install -g npm@latest && npm --version

            - name: Install dependencies
              run: npm ci

            # The engine builds itself on pack. A version already on npm is
            # left alone, so a run can be repeated after a later step failed.
            - name: Stage the version on npm with provenance
              working-directory: packages/engine
              run: |
                  if npm view "@jasonsdevspace/shelflens@$VERSION" version >/dev/null 2>&1; then
                      echo "$VERSION is already on npm"
                      exit 0
                  fi
                  tag=latest
                  [ "$PRERELEASE" = "true" ] && tag=next
                  npm stage publish --provenance --access public --tag "$tag"

            # A release on GitHub with the changelog entry as its notes, so
            # the tag has a page a reader can land on. Left alone if it exists.
            # The notes say the version is live once promoted on npm.
            - name: Create the GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  flags=""
                  [ "$PRERELEASE" = "true" ] && flags="--prerelease"
                  scripts/github-release.sh "$TAG" "$VERSION" packages/engine/CHANGELOG.md \
                      "@jasonsdevspace/shelflens $VERSION" $flags

    # The storefront is deployed from main by CI, so its release is a page
    # that names the version and says what changed. It is not marked as the
    # repository's latest release, which stays the engine's, since that is
    # what someone installing the package is looking for.
    storefront:
        needs: [agree, checks]
        if: needs.agree.outputs.package == 'storefront'
        runs-on: ubuntu-latest
        permissions:
            contents: write
        env:
            VERSION: ${{ needs.agree.outputs.version }}
            PRERELEASE: ${{ needs.agree.outputs.prerelease }}
            TAG: ${{ github.ref_name }}
        steps:
            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false

            - name: Create the GitHub release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  flags="--latest=false"
                  [ "$PRERELEASE" = "true" ] && flags="$flags --prerelease"
                  scripts/github-release.sh "$TAG" "$VERSION" packages/storefront/CHANGELOG.md \
                      "ShelfLens storefront $VERSION" $flags
