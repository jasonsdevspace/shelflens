# Weekly checks for newer versions of everything this repo depends on.
#
# The workflow actions are pinned to commit hashes, which never move on their
# own, so without this they would quietly fall behind. Minor and patch updates
# are grouped into one pull request per ecosystem to keep the noise down, with
# TypeScript and its lint plugin in a group of their own.
# Security fixes arrive separately, as soon as an advisory is published.
# Each update carries the dependencies label alone, so pull requests sort by
# the kind of work rather than by the package manager. A new version waits a
# week before it is offered, so a release pulled for being compromised is
# usually gone before it is proposed. Security updates do not wait.
version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
      labels: ['dependencies']
      groups:
          # TypeScript and its lint plugin move together. typescript-eslint
          # names the TypeScript versions it supports down to the minor, so
          # Dependabot only offers a TypeScript minor once the plugin accepts it.
          typescript:
              patterns: ['typescript', 'typescript-eslint', '@typescript-eslint/*']
              update-types: [minor, patch]
          npm:
              update-types: [minor, patch]
      # A new TypeScript major waits for typescript-eslint to support it,
      # since the lint tooling refuses to install against an unsupported one.
      ignore:
          - dependency-name: typescript
            update-types: ['version-update:semver-major']
          # The Node types follow the Node major in .nvmrc.
          - dependency-name: '@types/node'
            update-types: ['version-update:semver-major']

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
      labels: ['dependencies']
      groups:
          actions:
              patterns: ['*']
