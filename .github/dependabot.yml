# Weekly checks for newer versions of everything this repo depends on.
#
# The workflow actions are pinned to commit hashes, which never move on their
# own, so without this they would quietly fall behind. Minor and patch updates
# are grouped into one pull request per ecosystem to keep the noise down, with
# TypeScript and its lint plugin in a group of their own, the GraphQL codegen
# packages in another, majors and all, and the prose check in one of its own,
# since it moves in a pull request of its own.
# Security fixes arrive separately, as soon as an advisory is published.
# Each update carries the dependencies label alone, so pull requests sort by
# the kind of work rather than by the package manager. A new version waits a
# week before it is offered, so a release pulled for being compromised is
# usually gone before it is proposed. Security updates do not wait.
version: 2
updates:
    - package-ecosystem: npm
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
      labels: ['dependencies']
      groups:
          # The prose check moves in a pull request of its own, since a new rule can fail this
          # repository's own text and should not hold back the other updates.
          prose-check:
              patterns: ['@jasonsdevspace/prose-check']
          # TypeScript and its lint plugin move together. typescript-eslint
          # names the TypeScript versions it supports down to the minor, so
          # Dependabot only offers a TypeScript minor once the plugin accepts it.
          typescript:
              patterns: ['typescript', 'typescript-eslint', '@typescript-eslint/*']
              update-types: [minor, patch]
          # The codegen CLI and its plugins share helper packages, so a major
          # of one alone installs two copies of the helpers and codegen fails.
          # They move together, majors included.
          graphql-codegen:
              patterns: ['@graphql-codegen/*']
          npm:
              update-types: [minor, patch]
      # A new TypeScript major waits for typescript-eslint to support it,
      # since the lint tooling refuses to install against an unsupported one.
      ignore:
          - dependency-name: typescript
            update-types: ['version-update:semver-major']
          # The Node types follow the Node major in .nvmrc.
          - dependency-name: '@types/node'
            update-types: ['version-update:semver-major']
          # Playwright moves with the Linux image the screenshots are taken in, which
          # Dependabot cannot see, so both are raised by hand, and the screenshots taken
          # again in the new image.
          - dependency-name: '@playwright/test'
          - dependency-name: playwright
          # Lighthouse 13.6 brought in a source-available license and a
          # moderate advisory through its error reporting, so it stays on 13.5
          # until a later version drops them, checked by hand.
          - dependency-name: lighthouse
            versions: ['>=13.6.0']
          # The design kit's version moves by hand, in a pull request of its own that
          # reads the release's Upgrading notes and checks the pages, since a release of
          # the kit can change what a page draws. A security fix for it still arrives on
          # its own, since a rule that names only the package holds back version updates.
          - dependency-name: '@jasonsdevspace/design-kit'

    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      cooldown:
          default-days: 7
      labels: ['dependencies']
      groups:
          actions:
              patterns: ['*']
